name: Bug report
description: Something in omega-zero does not work the way it should.
labels: [bug]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - RG35XX SP
        - RG35XX Plus / 2024
        - RG35XX H
        - RG35XX Pro
        - RG34XX
        - RG34XX SP
        - RG SP
        - RG40XX H
        - RG40XX V
        - RG CubeXX
        - RG28XX
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: omega-zero and BaseOS versions
      description: omega-zero's version is on the About label. BaseOS's is in /etc/baseos-release.
      placeholder: omega-zero v0.1.0, BaseOS v1.3.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what omega-zero did instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: omega-zero.log
      description: Paste omega-zero.log from the root of the card omega-zero runs from.
      render: text
